# TV Tá Ligado — Sprint 1. Projeto isolado: nome fixo, rede própria, volumes
# prefixados, sem portas publicadas por padrão e com limites de recurso.
name: tvtl

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-pg-env: &pg-env
  POSTGRES_USER: ${POSTGRES_USER:-tvtl}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tvtl}

networks:
  tvtl_net:
    name: tvtl_net
    driver: bridge

volumes:
  tvtl_pgdata:
    name: tvtl_pgdata
  tvtl_media:
    name: tvtl_media
  tvtl_gomod:
    name: tvtl_gomod
  tvtl_gocache:
    name: tvtl_gocache

services:
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *pg-env
      POSTGRES_DB: ${POSTGRES_DB:-tvtl}
    volumes:
      - tvtl_pgdata:/var/lib/postgresql/data
    networks: [tvtl_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: ${TVTL_PG_MEM:-512m}
    cpus: ${TVTL_PG_CPUS:-1}
    logging: *logging

  tvtl:
    build:
      context: .
      target: tvtl
    image: tvtl:local
    command: ["run"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tvtl}:${POSTGRES_PASSWORD:-tvtl}@postgres:5432/${POSTGRES_DB:-tvtl}?sslmode=disable
      TVTL_CONFIG_DIR: /app/config
      TVTL_OUTPUT_DIR: /app/output
      TVTL_MEDIA_DIR: /media
    # Mesmo uid/gid do dono do projeto, para gravar relatórios em ./output.
    user: "${TVTL_UID:-1000}:${TVTL_GID:-1000}"
    volumes:
      # YAML montado só-leitura: mudar persona/pauta não exige rebuild.
      - ./config:/app/config:ro
      # Relatório de cada execução (fora do git).
      - ./output:/app/output
      # Áudio das falas (Opus), um arquivo por hash de voz + texto falado.
      - tvtl_media:/media
    networks: [tvtl_net]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: ${TVTL_MEM:-256m}
    cpus: ${TVTL_CPUS:-1}
    logging: *logging

  # API da linha do tempo. Sem porta no host; `make debug-up` publica em 127.0.0.1.
  api:
    image: tvtl:local
    command: ["serve", "--listen", ":8080"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tvtl}:${POSTGRES_PASSWORD:-tvtl}@postgres:5432/${POSTGRES_DB:-tvtl}?sslmode=disable
      TVTL_CONFIG_DIR: /app/config
      TVTL_MEDIA_DIR: /media
    user: "${TVTL_UID:-1000}:${TVTL_GID:-1000}"
    volumes:
      - ./config:/app/config:ro
      - tvtl_media:/media:ro
    networks: [tvtl_net]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: ${TVTL_API_MEM:-256m}
    cpus: ${TVTL_API_CPUS:-1}
    logging: *logging

  api-debug:
    profiles: [debug]
    image: tvtl:local
    command: ["debug-proxy", "--listen", ":8080", "--target", "api:8080"]
    ports:
      - "127.0.0.1:${TVTL_API_PORT:-58080}:8080"
    networks: [tvtl_net]
    depends_on: [api]
    restart: "no"
    mem_limit: 64m
    cpus: 0.25
    logging: *logging

  # Site: estático + proxy só dos caminhos públicos da api (web/nginx/nginx.conf).
  # Sem porta publicada: só o túnel chega aqui.
  web:
    build:
      context: ./web
      target: web
    image: tvtl-web:local
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /var/cache/nginx:size=8m
    networks: [tvtl_net]
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    logging: *logging

  # Túnel Cloudflare para o web (e só para ele). Sem CF_TUNNEL_TOKEN: túnel
  # rápido (*.trycloudflare.com; `make url`). Com token: túnel nomeado
  # (o Makefile passa CF_TUNNEL_ARGS=run). Versão fixada na tag.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 ${CF_TUNNEL_ARGS:---url http://web:80}
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    networks: [tvtl_net]
    depends_on: [web]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging: *logging

  # Visemas: Rhubarb Lip Sync (modo fonético) sobre o áudio final.
  lipsync:
    build:
      context: .
      target: lipsync
    image: tvtl-lipsync:local
    networks: [tvtl_net]
    restart: unless-stopped
    mem_limit: ${TVTL_LIPSYNC_MEM:-512m}
    cpus: ${TVTL_LIPSYNC_CPUS:-1}
    logging: *logging

  # Vozes locais, só CPU. Quais sobem: COMPOSE_PROFILES (Makefile: TTS_PROFILES).
  tts-chatterbox:
    profiles: [chatterbox]
    build:
      context: docker
      dockerfile: tts-chatterbox/Dockerfile
    image: tvtl-tts-chatterbox:local
    environment:
      TTS_THREADS: ${TVTL_CHATTERBOX_CPUS:-4}
    volumes:
      - ./config/voices:/voices:ro
    networks: [tvtl_net]
    restart: unless-stopped
    mem_limit: ${TVTL_CHATTERBOX_MEM:-6g}
    cpus: ${TVTL_CHATTERBOX_CPUS:-4}
    logging: *logging

  tts-kokoro:
    profiles: [kokoro]
    build:
      context: docker
      dockerfile: tts-kokoro/Dockerfile
    image: tvtl-tts-kokoro:local
    environment:
      TTS_THREADS: ${TVTL_KOKORO_CPUS:-2}
    networks: [tvtl_net]
    restart: unless-stopped
    mem_limit: ${TVTL_KOKORO_MEM:-1536m}
    cpus: ${TVTL_KOKORO_CPUS:-2}
    logging: *logging

  tts-piper:
    profiles: [piper]
    build:
      context: docker
      dockerfile: tts-piper/Dockerfile
    image: tvtl-tts-piper:local
    environment:
      TTS_THREADS: ${TVTL_PIPER_CPUS:-1}
    networks: [tvtl_net]
    restart: unless-stopped
    mem_limit: ${TVTL_PIPER_MEM:-512m}
    cpus: ${TVTL_PIPER_CPUS:-1}
    logging: *logging

  # Acesso local ao Postgres só para depuração: `make debug-up`.
  # Publica apenas em 127.0.0.1, na porta TVTL_PG_PORT (padrão 55432).
  pg-debug:
    profiles: [debug]
    image: tvtl:local
    command: ["debug-proxy", "--listen", ":5432", "--target", "postgres:5432"]
    ports:
      - "127.0.0.1:${TVTL_PG_PORT:-55432}:5432"
    networks: [tvtl_net]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 64m
    cpus: 0.25
    logging: *logging

  # Banco efêmero para testes: sem porta no host, dados em tmpfs.
  postgres-test:
    profiles: [test]
    image: postgres:16-alpine
    environment:
      <<: *pg-env
      POSTGRES_DB: tvtl_test
    tmpfs:
      - /var/lib/postgresql/data
    networks: [tvtl_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tvtl_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
    mem_limit: ${TVTL_PGTEST_MEM:-512m}
    cpus: ${TVTL_PGTEST_CPUS:-1}
    logging: *logging

  # Toolchain Go em container (nada de Go no host): testes, tidy, vet.
  gotool:
    profiles: [tools]
    image: golang:1.27
    working_dir: /src
    environment:
      GOFLAGS: -buildvcs=false -p=2
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-tvtl}:${POSTGRES_PASSWORD:-tvtl}@postgres-test:5432/tvtl_test?sslmode=disable
    volumes:
      - .:/src
      - tvtl_gomod:/go/pkg/mod
      - tvtl_gocache:/root/.cache/go-build
    networks: [tvtl_net]
    restart: "no"
    mem_limit: ${TVTL_GO_MEM:-3g}
    cpus: ${TVTL_GO_CPUS:-2}
    logging: *logging
