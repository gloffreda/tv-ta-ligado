# Grade do MVP. Um bloco é gerado quando o último segmento aprovado dele
# ficou mais velho que `every`. Depois de uma tentativa rejeitada, espera
# `retry_after` antes de tentar de novo.
retry_after: 5m

# Linha do tempo (Sprint 2). BUFFER_MIN (variável de ambiente, padrão 10m) é
# quanto fica agendado à frente.
timeline:
  pause_between_lines_ms: 350      # mesma pessoa falando de novo
  pause_between_speakers_ms: 500   # troca de quem fala
  pause_between_items_ms: 800      # respiro no fim de cada item
  replay_min_gap: 60m              # nunca repetir o mesmo segmento em menos que isso
  bumper_text: "Tá ligado? Já voltamos."
  bumper_speaker: duda

# Temas fora do brief ficam fora da pauta (o MVP não tem bloco de saúde).
exclude:
  # resultado-das-eleicoes: páginas automáticas do g1, uma por município e
  # seção eleitoral (milhares por turno). Literais, mas hiperlocais e repetidas:
  # inundavam a pauta e as manchetes.
  url_parts: [/saude/, /saude., equilibrioesaude, /bem-estar/, /vivabem/, /medicina/, /coronavirus/, resultado-das-eleicoes]
  keywords: [saúde, doença, doenças, sintoma, sintomas, câncer, vacina, vacinação, médico, médicos, hospital, hospitais, tratamento, diagnóstico, remédio, medicamento, dieta, epidemia, pandemia, vírus, infecção, dengue, gripe, covid]

segment:
  min_lines: 8
  max_lines: 16
  min_seconds: 60
  max_seconds: 120
  words_per_minute: 150

check:
  max_fact_drop_ratio: 0.30   # acima disso o segmento é rejeitado
  min_lines_after_check: 6
  judge_concurrency: 4
  # Termos permitidos (instituições, lugares, avatares...): config/allowlist.yaml
  # Prenomes que indicam pessoa real: config/first_names.txt

blocks:
  - name: noticias
    every: 20m
    lead: orlando
    support: duda
    max_articles: 4
    instructions: |
      Orlando conduz e lê as notícias; Duda comenta com acidez sobre a situação,
      nunca sobre pessoas, e sem opinar sobre culpa de ninguém. A previsão do
      tempo é da Glória, em segmento próprio: não entra aqui.

  - name: economia
    every: 30m
    lead: orlando
    support: duda
    max_articles: 2
    include_market: true
    article_keywords: [economia, dólar, inflação, ipca, selic, juros, pib, emprego, desemprego, imposto, arrecadação, bolsa, ibovespa, petróleo, salário, mercado]
    instructions: |
      Orlando apresenta os dados; Duda traduz para o público o que eles significam
      no dia a dia, sem previsões. Só fatos: nunca recomende comprar, vender,
      investir, aplicar ou resgatar nada.
    closing_line: "Isso não é recomendação de investimento."
    forbidden_phrases: [recomendo, recomendamos, compre, comprem, venda seus, vendam, invista, invistam, aplique, apliquem, vale a pena investir, hora de comprar, hora de vender, resgate, resgatem]

  - name: humor
    every: 30m
    lead: duda
    support: orlando
    max_articles: 2
    instructions: |
      Duda conduz. O humor é sobre a situação ou sobre os próprios avatares
      (a rixa pela cadeira, a "máquina", a idade do Orlando, as gírias da Duda).
      Nunca faça piada sobre pessoas reais, grupos, tragédias ou vítimas.
      Escolha notícias leves; se nenhuma for leve, brinque só com o estúdio.

  # Blocos de dados (Sprint 3): modelos determinísticos, sem LLM. Cobrem o ar
  # enquanto a estreia é escrita e enchem os intervalos.
  - name: tempo
    data: weather
    every: 30m
    lead: gloria
    cast: [gloria]
    scene: tempo

  - name: mercado
    data: market
    every: 30m
    lead: orlando
    cast: [orlando]

  - name: manchetes
    data: headlines
    every: 15m
    lead: orlando
    support: duda

# Grade de programas (horário de Brasília). É o que a página mostra no guia de
# TV; o que vai ao ar de fato é a linha do tempo. O cenário e o elenco de
# cada programa vão para o player.
programs:
  weekdays:
    - {start: "00:00", end: "06:00", name: "Madrugada Ligada", scene: estudio, cast: [orlando, duda], about: "reprises da véspera"}
    - {start: "06:00", end: "09:00", name: "Bom Dia, Tá Ligado", scene: estudio, cast: [orlando, duda], about: "manchetes, mercado e tempo"}
    - {start: "09:00", end: "12:00", name: "Manhã Ligada", scene: estudio, cast: [orlando, duda], about: "notícias e economia"}
    - {start: "12:00", end: "14:00", name: "Tá Ligado Meio-Dia", scene: estudio, cast: [orlando, duda], about: "o resumo do meio-dia"}
    - {start: "14:00", end: "18:00", name: "Tarde Ligada", scene: estudio, cast: [duda, orlando], about: "notícias e humor"}
    - {start: "18:00", end: "21:00", name: "Jornal Tá Ligado", scene: estudio, cast: [orlando, duda], about: "o jornal da noite"}
    - {start: "21:00", end: "24:00", name: "Tá Ligado à Noite", scene: estudio, cast: [duda, orlando], about: "humor e o fechamento do dia"}
  weekend:
    - {start: "00:00", end: "08:00", name: "Madrugada Ligada", scene: estudio, cast: [orlando, duda], about: "reprises"}
    - {start: "08:00", end: "12:00", name: "Fim de Semana Ligado", scene: estudio, cast: [duda, orlando], about: "manchetes e humor"}
    - {start: "12:00", end: "18:00", name: "Tarde de Domingo Ligada", scene: estudio, cast: [duda, orlando], about: "humor e resumo da semana"}
    - {start: "18:00", end: "24:00", name: "Jornal Tá Ligado — Fim de Semana", scene: estudio, cast: [orlando, duda], about: "o jornal da noite"}
  # Previsão do tempo com a Glória: entra por cima da grade nestes horários.
  weather:
    name: "Tempo com Glória Garoa"
    at: ["06:50", "12:50", "18:50", "21:50"]
    minutes: 10
    scene: tempo
    cast: [gloria]
    block: tempo
  # Plantão: aviso oficial de grande perigo (INMET) fura a fila.
  plantao:
    name: "Plantão Tá Ligado"
    scene: estudio
    cast: [orlando, gloria]
    about: "aviso oficial de grande perigo"
