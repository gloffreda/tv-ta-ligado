  provider: kokoro
  name: pf_dora*0.5+if_sara*0.5
  rate: 0.98
  pitch: 0
  style: ""
fallback_voices:
  kokoro: {provider: kokoro, name: pf_dora, rate: 0.94, pitch: -1.5}

