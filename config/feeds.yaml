# Banco Central — API SGS. min/max confirmam que o código é a série certa
# (a resposta da API não traz o nome da série).
bcb:
  - code: 1
    key: dolar
    label: Dólar comercial (venda)
    unit: BRL
    min: 2
    max: 15
    entities: [Banco Central]
    claim: "O dólar comercial (venda) ficou em R$ {valor} em {data}, segundo o Banco Central."
  - code: 432
    key: selic
    label: Meta da taxa Selic
    unit: "% a.a."
    min: 1
    max: 30
    entities: [Banco Central, Selic, Copom]
    claim: "A meta da taxa Selic, definida pelo Copom, está em {valor}% ao ano, segundo o Banco Central (dado de {data})."
  - code: 433
    key: ipca
    label: IPCA — variação mensal
    unit: "%"
    min: -3
    max: 5
    entities: [Banco Central, IPCA]
    claim: "O IPCA, índice oficial de inflação, variou {valor}% em {mes_ano}, segundo dados do Banco Central."

