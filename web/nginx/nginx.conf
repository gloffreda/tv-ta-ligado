# nginx do site: estático + proxy SOMENTE dos caminhos públicos da api.
# (add_header só no server: um add_header dentro de location apagaria os
# cabeçalhos de segurança herdados.)
# Roda read-only (tmpfs em /tmp e /var/cache/nginx), sem porta publicada;
# só o túnel chega aqui.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types { audio/ogg ogg; }
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;
    client_max_body_size  4k;

    # IP real do visitante: o Cloudflare manda CF-Connecting-IP; o túnel fala
    # com o nginx de dentro da rede do Docker.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /dev/stdout main;

    # /v1: 10 req/s por IP, rajada de 20.
    limit_req_zone $binary_remote_addr zone=v1:10m rate=10r/s;
    limit_req_status 429;

    # api resolvida na hora (o nginx sobe mesmo se a api ainda não estiver de pé).
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $request_method $not_get { default 1; GET 0; HEAD 0; }
    map $request_method $not_post { default 1; POST 0; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

        set $api http://api:8080;

        # ---- leitura ----
        location ~ ^/v1/(now|timeline|schedule|session)$ {
            if ($not_get) { return 404; }
            limit_req zone=v1 burst=20 nodelay;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_hide_header Access-Control-Allow-Origin;
        }

        # ---- eventos (SSE) ----
        location = /v1/events {
            if ($not_get) { return 404; }
            limit_req zone=v1 burst=20 nodelay;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_hide_header Access-Control-Allow-Origin;
        }

        # ---- ligar/desligar sessão (o token vai no corpo; nunca em log) ----
        location ~ ^/v1/session/(start|stop)$ {
            if ($not_post) { return 404; }
            limit_req zone=v1 burst=20 nodelay;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_hide_header Access-Control-Allow-Origin;
        }

        # Todo o resto de /v1: 404.
        location /v1/ { return 404; }

        # ---- áudio ----
        location ~ "^/media/[0-9a-f]{64}\.ogg$" {
            if ($not_get) { return 404; }
            limit_req zone=v1 burst=40 nodelay;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /media/ { return 404; }

        # ---- site ----
        location = / { expires -1; try_files /index.html =404; }
        location ~ ^/humano/?$ { expires -1; try_files /index.html =404; }
        location /assets/ {
            if ($not_get) { return 404; }
            expires max;
            try_files $uri =404;
        }
        location = /favicon.svg { try_files $uri =404; }

        # Qualquer outro caminho (/.env, /nginx.conf, /index.html direto…): 404.
        location / { return 404; }
    }
}
